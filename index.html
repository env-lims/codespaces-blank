<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMV7 Cute File Browser - Login</title>
    <style>
        :root {
            --primary-color: #5c7cfa;
            --primary-hover: #4c6ef5;
            --bg-color: #f0f3f9;
            --card-bg: #ffffff;
            --text-main: #343a40;
            --text-muted: #868e96;
            --border-color: #e9ecef;
            --accent-folder: #ffd43b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(var(--border-color) 15%, transparent 15%),
                radial-gradient(var(--border-color) 15%, transparent 15%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            overflow: hidden;
        }

        /* Decorative background elements */
        .bg-deco {
            position: absolute;
            font-size: 3rem;
            user-select: none;
            opacity: 0.15;
            animation: float 6s ease-in-out infinite;
        }
        .deco-1 { top: 10%; left: 10%; animation-delay: 0s; }
        .deco-2 { bottom: 15%; left: 15%; animation-delay: 2s; font-size: 4rem; }
        .deco-3 { top: 15%; right: 12%; animation-delay: 4s; }
        .deco-4 { bottom: 10%; right: 10%; animation-delay: 1s; font-size: 3.5rem; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        /* Login Container with Cute Folder Tab styling */
        .login-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
            padding: 10px;
            z-index: 10;
        }

        /* Cute Folder Tab */
        .folder-tab {
            position: absolute;
            top: -24px;
            left: 30px;
            height: 35px;
            width: 120px;
            background-color: var(--card-bg);
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--primary-color);
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.03);
            border: 2px solid var(--border-color);
            border-bottom: none;
            z-index: 1;
        }

        .folder-tab::after {
            content: '';
            position: absolute;
            right: -25px;
            bottom: 0;
            width: 0;
            height: 0;
            border-bottom: 33px solid var(--card-bg);
            border-right: 25px solid transparent;
        }

        .login-card {
            background-color: var(--card-bg);
            border-radius: 18px;
            border: 2px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            position: relative;
            z-index: 2;
            transition: transform 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-2px);
        }

        /* Header / Title area */
        .card-header {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 30px 24px 20px;
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            position: relative;
        }

        /* Cute browser-like window controls */
        .window-controls {
            position: absolute;
            top: 12px;
            left: 15px;
            display: flex;
            gap: 6px;
        }

        .control-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .dot-red { background-color: #ff6b6b; }
        .dot-yellow { background-color: #fcc419; }
        .dot-green { background-color: #51cf66; }

        .logo-container {
            width: 70px;
            height: 70px;
            background-color: #fff;
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            border: 2px solid var(--border-color);
        }

        .brand-name {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Form Area */
        .card-body {
            padding: 28px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            font-size: 1.1rem;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            font-size: 0.95rem;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            outline: none;
            transition: all 0.2s ease;
            color: var(--text-main);
            background-color: #f8f9fa;
        }

        .form-input:focus {
            border-color: var(--primary-color);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(92, 124, 250, 0.15);
        }

        /* Simple Cute Options: Remember Me & File Browser Mode */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 0.85rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }

        .remember-me input {
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: var(--primary-color);
        }

        .forgot-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        /* Buttons */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(92, 124, 250, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(92, 124, 250, 0.3);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        /* Alert/Status box */
        .status-message {
            margin-top: 15px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: center;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-error {
            background-color: #fff0f6;
            color: #f783ac;
            border: 1px solid #ffd8a8;
        }

        .status-success {
            background-color: #ebfbee;
            color: #40c057;
            border: 1px solid #b2f2bb;
        }

        /* Cute Footer */
        .card-footer {
            background-color: #f8f9fa;
            padding: 15px 24px;
            text-align: center;
            border-top: 2px solid var(--border-color);
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-link {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-link:hover {
            color: var(--primary-color);
        }

        /* Login Success Overlay for demonstration */
        .success-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fff;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: translateY(100%);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 20px;
            text-align: center;
        }

        .success-overlay.active {
            transform: translateY(0);
        }

        .success-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        .success-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .success-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .btn-logout {
            padding: 10px 20px;
            background-color: var(--border-color);
            border: none;
            border-radius: 8px;
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            background-color: #dee2e6;
        }
    </style>
</head>
<body>

    <!-- Floating Background Decos (Cute File Browser Theme) -->
    <div class="bg-deco deco-1">📂</div>
    <div class="bg-deco deco-2">📄</div>
    <div class="bg-deco deco-3">📁</div>
    <div class="bg-deco deco-4">💾</div>

    <div class="login-wrapper">
        <!-- Cute Folder Tab -->
        <div class="folder-tab">
            <span>root/login</span>
        </div>

        <div class="login-card">
            <!-- success screen layer -->
            <div class="success-overlay" id="successOverlay">
                <div class="success-icon">🎉</div>
                <h2 class="success-title">환영합니다!</h2>
                <p class="success-desc">OMV7 파일브라우저 시스템에 정상적으로 연결되었습니다.</p>
                <button class="btn-logout" id="logoutBtn">돌아가기</button>
            </div>

            <!-- Header -->
            <div class="card-header">
                <div class="window-controls">
                    <span class="control-dot dot-red"></span>
                    <span class="control-dot dot-yellow"></span>
                    <span class="control-dot dot-green"></span>
                </div>
                <div class="logo-container">
                    📂
                </div>
                <h1 class="brand-name">OMV7 CuteNAS</h1>
                <p class="brand-subtitle">귀여운 간이 파일 브라우저 시스템</p>
            </div>

            <!-- Form -->
            <div class="card-body">
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label" for="username">사용자 이름</label>
                        <div class="input-wrapper">
                            <span class="input-icon">👤</span>
                            <input class="form-input" type="text" id="username" placeholder="사용자명을 입력하세요" required autocomplete="username">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">비밀번호</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input class="form-input" type="password" id="password" placeholder="비밀번호를 입력하세요" required autocomplete="current-password">
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="remember">
                            로그인 상태 유지
                        </label>
                        <a href="#" class="forgot-link">비밀번호 찾기</a>
                    </div>

                    <button class="btn-submit" type="submit">
                        파일 브라우저 열기 ⚡
                    </button>

                    <div class="status-message status-error" id="statusMessage">
                        사용자 이름 또는 비밀번호를 다시 확인해 주세요!
                    </div>
                </form>
            </div>

            <!-- Footer -->
            <div class="card-footer">
                <span>Version 7.0.4-cute</span>
                <a href="https://github.com" target="_blank" class="footer-link">GitHub</a>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const statusMessage = document.getElementById('statusMessage');
            const successOverlay = document.getElementById('successOverlay');

            // Simple demo check: any non-empty counts, but let's make a cute mock validation
            // e.g. if password is 'admin', or anything really. Let's make it accept admin/admin or any non-empty.
            if (usernameInput.value.trim() === 'admin' && passwordInput.value === '1234') {
                // Success! Show cute success overlay
                successOverlay.classList.add('active');
                statusMessage.style.display = 'none';
            } else if (usernameInput.value.trim() && passwordInput.value) {
                // If they typed something else, let's allow it as a demo but give option for custom
                // Or let's accept anything for a friendly login, and only fail if empty
                successOverlay.classList.add('active');
                statusMessage.style.display = 'none';
            } else {
                statusMessage.style.display = 'block';
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            const successOverlay = document.getElementById('successOverlay');
            successOverlay.classList.remove('active');
            
            // Clear fields
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        });
    </script>
</body>
</html>
